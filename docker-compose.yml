services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload_cache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload_cache}
      POSTGRES_DB: ${POSTGRES_DB:-payload_cache}
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
